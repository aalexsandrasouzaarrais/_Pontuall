<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Pontual - Login</title>

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="assets/images/favicon.png">
    <link rel="shortcut icon" href="assets/images/favicon.ico" type="image/x-icon">
    <link rel="apple-touch-icon" href="assets/images/favicon.png">

    <!-- CSS -->
    <link rel="stylesheet" href="assets/css/login2.css">

    <style>
        /* =========================================================
           TEMA — componente separado e delicado
        ========================================================= */

        .right-panel {
            position: relative;
            transition: background-color .35s ease, color .35s ease;
        }

        .form-container {
            position: relative;
            width: 100%;
            max-width: 400px;
        }

        .icon-login {
            margin: 0 auto 22px auto !important;
            width: 58px !important;
            height: 58px !important;
            object-fit: contain;
        }

        .icon-login--light {
            display: none !important;
        }

        .icon-login--dark {
            display: block !important;
        }

        body.theme-light .icon-login--dark {
            display: none !important;
        }

        body.theme-light .icon-login--light {
            display: block !important;
        }

        .role-selector {
            margin: 0 0 22px 0 !important;
            padding: 5px !important;
            gap: 8px !important;
        }

        .role-btn {
            padding: 9px 12px !important;
            font-size: 13px !important;
        }

        .form-container h2,
        #formTitle {
            margin-bottom: 8px !important;
            font-size: 22px !important;
        }

        .form-subtitle {
            margin-bottom: 24px !important;
            font-size: 12.5px !important;
            line-height: 1.5 !important;
        }

        .input-group {
            margin-bottom: 18px !important;
        }

        .input-group label {
            margin-bottom: 7px !important;
            font-size: 12.5px !important;
        }

        .input-group input,
        .input-wrapper input,
        .password-wrapper input {
            height: 44px !important;
            padding: 0 14px !important;
            border-radius: 10px !important;
            font-size: 13.5px !important;
        }

        .continue-button {
            margin-top: 22px !important;
            height: 44px !important;
            border-radius: 10px !important;
            font-size: 14px !important;
        }

        .login-text,
        #signupPrompt {
            margin-top: 16px !important;
            font-size: 12px !important;
        }

        .divider {
            margin: 20px 0 !important;
        }

        .google-button {
            height: 42px !important;
            border-radius: 10px !important;
            font-size: 13.5px !important;
        }

        .theme-switcher {
            position: absolute;
            top: 18px;
            right: 18px;
            z-index: 20;

            display: flex;
            align-items: center;
            gap: 3px;

            padding: 4px;
            border: 1px solid rgba(255, 255, 255, .10);
            border-radius: 999px;

            background: rgba(255, 255, 255, .045);
            box-shadow: 0 8px 24px rgba(0, 0, 0, .12);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);

            transition:
                background .35s ease,
                border-color .35s ease,
                box-shadow .35s ease;
        }

        .theme-option {
            width: 29px;
            height: 29px;
            padding: 0;

            display: flex;
            align-items: center;
            justify-content: center;

            border: 0;
            border-radius: 50%;
            background: transparent;

            color: #8d8d8d;
            cursor: pointer;

            transition:
                color .25s ease,
                background .25s ease,
                transform .2s ease,
                box-shadow .25s ease;
        }

        .theme-option:hover {
            color: #ffffff;
            transform: translateY(-1px);
        }

        .theme-option.is-active {
            color: #ffffff;
            background: linear-gradient(135deg, #ff963f, #b31d43);
            box-shadow: 0 4px 12px rgba(198, 62, 60, .25);
        }

        .theme-option:focus-visible {
            outline: 2px solid rgba(255, 150, 63, .75);
            outline-offset: 2px;
        }

        .theme-option__icon {
            pointer-events: none;
        }

        /* =========================================================
           TEMA CLARO
           Tema proporcional: inclui o painel esquerdo e cards.
        ========================================================= */

        body.theme-light .right-panel {
            background: #ffffff !important;
            color: #252525;
        }

        body.theme-light .theme-switcher {
            border-color: rgba(85, 24, 38, .12);
            background: rgba(255, 255, 255, .78);
            box-shadow: 0 8px 24px rgba(70, 35, 40, .08);
        }

        body.theme-light .theme-option {
            color: #777;
        }

        body.theme-light .theme-option:hover {
            color: #6f142b;
        }

        body.theme-light .theme-option.is-active {
            color: #ffffff;
        }

        body.theme-light #formTitle {
            color: #241d1f !important;
        }

        body.theme-light .form-subtitle {
            color: #777 !important;
        }

        body.theme-light .input-group label {
            color: #342a2d !important;
        }

        body.theme-light .input-wrapper input,
        body.theme-light .password-wrapper input {
            background: #ffffff !important;
            border-color: #ded9d8 !important;
            color: #292526 !important;
            box-shadow: 0 2px 8px rgba(60, 30, 35, .03);
        }

        body.theme-light .input-wrapper input::placeholder,
        body.theme-light .password-wrapper input::placeholder {
            color: #999 !important;
        }

        body.theme-light .role-selector {
            background: #eeeceb !important;
            border-color: #dfdbda !important;
        }

        body.theme-light .role-btn {
            color: #777 !important;
        }

        body.theme-light .role-btn.active {
            background: linear-gradient(135deg, #f89642, #96183c) !important;
            color: #ffffff !important;
            box-shadow: 0 4px 14px rgba(150, 24, 60, 0.25) !important;
        }

        body.theme-light .divider p {
            color: #8a8585 !important;
        }

        body.theme-light .divider span {
            background: #ded9d8 !important;
        }

        body.theme-light .google-button {
            background: #ffffff !important;
            border-color: #ded9d8 !important;
            color: #302b2c !important;
        }

        body.theme-light .login-text {
            color: #777 !important;
        }

        /* ----- Painel Esquerdo (Claro proporcional) ----- */
        body.theme-light .left-panel {
            background:
                radial-gradient(circle at 32% 18%, rgba(248, 150, 66, .60) 0%, rgba(248, 150, 66, .12) 22%, transparent 45%),
                linear-gradient(135deg, #7a2234 0%, #a82e4a 52%, #5e1828 100%) !important;
        }

        body.theme-light .left-panel::before {
            background: radial-gradient(circle, rgba(248, 150, 66, .25), transparent 65%);
        }

        body.theme-light .left-panel::after {
            border-top-color: rgba(248, 150, 66, .35);
            box-shadow: 0 -10px 30px rgba(150, 24, 60, .10);
        }

        /* Gradiente de alto contraste e luminosidade para leitura perfeita */
        .hero-content h1 span,
        .left-content h1 span,
        body.theme-light .hero-content h1 span,
        body.theme-light .left-content h1 span {
            background: linear-gradient(90deg, #fff3a8 0%, #ffb347 48%, #ff8359 100%) !important;
            -webkit-background-clip: text !important;
            background-clip: text !important;
            color: transparent !important;
            display: inline-block;
        }

        body.theme-light .badge {
            background: rgba(255, 255, 255, 0.15);
            border-color: rgba(255, 255, 255, 0.25);
            color: #fff5e0;
        }

        body.theme-light .hero-description {
            color: rgba(255, 255, 255, 0.78);
        }

        /* ----- Cards das Etapas (Claro - Fundo Branco e Opaco) ----- */
        body.theme-light .step {
            background: #ffffff;
            border: 1px solid rgba(255, 255, 255, 0.60);
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.12);
        }

        body.theme-light .step:hover {
            background: #ffffff;
            border-color: rgba(248, 150, 66, 0.60);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.18);
            transform: translateY(-3px);
        }

        body.theme-light .step.active,
        body.theme-light .step.completed {
            background:
                linear-gradient(#ffffff, #ffffff) padding-box,
                linear-gradient(135deg, #faf0ac, #f89642, #96183c) border-box;
            border: 2px solid transparent;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.16), 0 0 16px rgba(248, 150, 66, 0.20);
        }

        body.theme-light .step-number {
            border: 1px solid #e0d2cf;
            background: #f7f3f2;
            color: #7a2234;
        }

        body.theme-light .step.active .step-number,
        body.theme-light .step.completed .step-number {
            background: linear-gradient(135deg, #faf0ac, #f89642);
            color: #5e1828;
            border: none;
            box-shadow: 0 4px 14px rgba(248, 150, 66, 0.35);
        }

        body.theme-light .step-text {
            color: #4a383d;
        }

        body.theme-light .step.active .step-text,
        body.theme-light .step.completed .step-text {
            color: #1f1418;
            font-weight: 600;
        }

        /* Transição geral para evitar troca brusca de cores. */
        .signup-container,
        .left-panel,
        .right-panel,
        .form-container,
        .input-wrapper input,
        .password-wrapper input,
        .role-selector,
        .google-button,
        .step,
        .step-number,
        .step-text,
        .badge {
            transition:
                background .35s ease,
                background-color .35s ease,
                border-color .35s ease,
                color .35s ease,
                box-shadow .35s ease;
        }

        @media (max-width: 700px) {
            .theme-switcher {
                top: 12px;
                right: 12px;
            }
        }
    </style>

    <!-- Fonte -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
        rel="stylesheet">
</head>

<body>

    <main class="page">
<section class="signup-container">

            <!-- =================================================
                 LADO ESQUERDO
            ================================================== -->

            <div class="left-panel">

                <!-- Logo -->
               <div class="logo2"> 
                    <img src="assets/images/logo_pontual_transparente.png" alt="Pontual Logo" width="160px" >
                    <img src="assets/images/Pontual-Branco.png" alt="" >
                </div>


                <!-- Conteúdo -->
                <div class="hero-content">

                    <div class="badge">
                        Junte-se a nós
                    </div>

                    <h1 id="heroTitle">
                        Acesse sua<br>
                        <span>jornada</span>
                    </h1>

                    <p class="hero-description" id="heroDesc">
                        Siga estes passos simples para acessar
                        sua conta.
                    </p>

                    <!-- ETAPAS -->
                    <div class="steps">

                        <!-- Etapa 1 -->
                        <div class="step active" id="step1">

                            <div class="step-number" id="stepNum1">
                                1
                            </div>

                            <div class="step-text" id="stepText1">
                                Informe seu
                                <br>
                                email
                            </div>

                        </div>

                        <!-- Etapa 2 -->
                        <div class="step" id="step2">

                            <div class="step-number" id="stepNum2">
                                2
                            </div>

                            <div class="step-text" id="stepText2">
                                Configure sua
                                <br>
                                senha
                            </div>

                        </div>

                        <!-- Etapa 3 -->
                        <div class="step" id="step3">

                            <div class="step-number" id="stepNum3">
                                3
                            </div>

                            <div class="step-text" id="stepText3">
                                Aproveite sua experiência
                                <br>
                                Pontual
                            </div>

                        </div>

                    </div>

                </div>

            </div>


            <!-- =================================================
                 LADO DIREITO
            ================================================== -->

            <div class="right-panel">

                <!-- =================================================
                     SELETOR DE TEMA (Fixado no topo superior direito)
                ================================================== -->
                <div class="theme-switcher" id="themeSwitcher" aria-label="Escolha o tema">
                    <button
                        type="button"
                        class="theme-option theme-option--dark"
                        data-theme="dark"
                        aria-label="Tema escuro"
                        aria-pressed="false"
                        title="Tema escuro">
                        <svg class="theme-option__icon" width="15" height="15" viewBox="0 0 24 24"
                            fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                            stroke-linejoin="round" aria-hidden="true">
                            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
                        </svg>
                    </button>

                    <button
                        type="button"
                        class="theme-option theme-option--light is-active"
                        data-theme="light"
                        aria-label="Tema claro"
                        aria-pressed="true"
                        title="Tema claro">
                        <svg class="theme-option__icon" width="15" height="15" viewBox="0 0 24 24"
                            fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                            stroke-linejoin="round" aria-hidden="true">
                            <circle cx="12" cy="12" r="4"></circle>
                            <path d="M12 2v2"></path>
                            <path d="M12 20v2"></path>
                            <path d="m4.93 4.93 1.41 1.41"></path>
                            <path d="m17.66 17.66 1.41 1.41"></path>
                            <path d="M2 12h2"></path>
                            <path d="M20 12h2"></path>
                            <path d="m6.34 17.66-1.41 1.41"></path>
                            <path d="m19.07 4.93-1.41 1.41"></path>
                        </svg>
                    </button>
                </div>

                <div class="form-container">

                    <!-- Logo -->
                    <img
                        class="icon-login icon-login--dark"
                        src="assets/images/logo_pontual_transparente.png"
                        alt="Pontual Logo"
                    >
                    <img
                        class="icon-login icon-login--light"
                        src="assets/images/logo_pontual_claro.png"
                        alt="Pontual Logo"
                    >

                    <!-- SELETOR DE PERFIL (COLABORADOR / GESTOR) -->
                    <div class="role-selector" role="tablist" aria-label="Selecione o perfil de acesso">
                        <button type="button" class="role-btn active" id="btnRoleColaborador" role="tab" aria-selected="true">
                            <svg class="role-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                                <circle cx="12" cy="7" r="4"></circle>
                            </svg>
                            <span>Colaborador</span>
                        </button>
                        <button type="button" class="role-btn" id="btnRoleGestor" role="tab" aria-selected="false">
                            <svg class="role-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"></path>
                                <circle cx="9" cy="7" r="4"></circle>
                                <path d="M22 21v-2a4 4 0 0 0-3-3.87"></path>
                                <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
                            </svg>
                            <span>Gestor</span>
                        </button>
                    </div>

                    <h2 id="formTitle">Entrar como Colaborador</h2>
                    <p class="form-subtitle" id="formSubtitle">Acesse com seu email corporativo e senha.</p>


                    <!-- EMAIL -->

                    <div class="input-group">

                        <label for="email">
                            Email
                        </label>

                        <div class="input-wrapper">

                            <input
                                type="email"
                                id="email"
                                placeholder="Digite seu email"
                                required
                            >

                        </div>

                    </div>


                    <!-- SENHA -->

                    <div class="input-group">

                        <label for="password">
                            Senha
                        </label>

                        <div class="password-wrapper">

                            <input
                                type="password"
                                id="password"
                                placeholder="••••••••••••••••"
                            >

                            <button
                                type="button"
                                class="eye"
                                id="togglePassword"
                                aria-label="Mostrar ou ocultar senha"
                            >

                                <svg
                                    id="eyeIcon"
                                    width="18"
                                    height="18"
                                    viewBox="0 0 24 24"
                                    fill="none"
                                    stroke="currentColor"
                                    stroke-width="2"
                                    stroke-linecap="round"
                                    stroke-linejoin="round"
                                >

                                    <path
                                        d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z">
                                    </path>

                                    <circle
                                        cx="12"
                                        cy="12"
                                        r="3">
                                    </circle>

                                </svg>

                            </button>

                        </div>

                    </div>

                    <!-- MENSAGEM DE FEEDBACK / ERRO (Overlay flutuante para não alterar o layout ou tamanho) -->
                    <div id="loginFeedback" class="login-feedback" style="display: none; position: fixed; top: 24px; left: 50%; transform: translateX(-50%); z-index: 9999; padding: 12px 24px; border-radius: 12px; font-size: 13px; font-weight: 600; box-shadow: 0 12px 30px rgba(0,0,0,0.6); pointer-events: none; transition: all .25s ease;"></div>

                    <!-- BOTÃO -->

                    <button
                        type="button"
                        class="continue-button"
                        id="continueButton"
                    >

                        <span id="continueButtonText">
                            Entrar
                        </span>

                    </button>


                    <!-- LOGIN / CADASTRO TOGGLE (APENAS PARA GESTOR) -->

                    <p class="login-text" id="signupPrompt" style="display: none;">

                        <span id="signupPromptText">
                            Ainda não possui uma conta?
                        </span>

                        <a href="conta2.html" id="toggleSignMode">
                            Criar conta
                        </a>

                    </p>


                    <!-- OU -->

                    <div class="divider">

                        <span></span>

                        <p>Ou</p>

                        <span></span>

                    </div>


                    <!-- GOOGLE -->

                    <button
                        type="button"
                        class="google-button"
                        id="googleButton"
                    >

                        <span class="google-icon">
                            G
                        </span>

                        <span id="googleButtonText">
                            Entrar com Google
                        </span>

                    </button>

                </div>

            </div>

        </section>

    </main>


    <!-- JAVASCRIPT -->


    <script>
        /* =========================================================
           CONTROLE DO TEMA
        ========================================================= */

        const themeSwitcher = document.getElementById('themeSwitcher');
        const themeOptions = document.querySelectorAll('.theme-option');

        function applyTheme(theme) {
            document.body.classList.remove('theme-dark', 'theme-light');
            document.body.classList.add(`theme-${theme}`);

            themeOptions.forEach(option => {
                const isActive = option.dataset.theme === theme;

                option.classList.toggle('is-active', isActive);
                option.setAttribute('aria-pressed', isActive ? 'true' : 'false');
            });

            localStorage.setItem('pontual-theme', theme);
        }

        themeOptions.forEach(option => {
            option.addEventListener('click', () => {
                applyTheme(option.dataset.theme);
            });
        });

        /* Mantém a preferência do usuário ao recarregar a página. */
        const savedTheme = localStorage.getItem('pontual-theme') || 'light';

        applyTheme(savedTheme === 'dark' ? 'dark' : 'light');
    </script>

    <script src="assets/js/script.js"></script>

</body>

</html>
